spring.application.name=syncpass-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/syncpass}
spring.datasource.username=${DATABASE_USER:syncpass}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
syncpass.issuer=${COGNITO_ISSUER}
syncpass.client-id=${COGNITO_CLIENT_ID}
syncpass.origins=${CORS_ORIGINS:http://localhost:3000}
syncpass.region=${AWS_REGION:us-east-1}
