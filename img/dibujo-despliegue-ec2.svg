<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-label="Despliegue de la API de SyncPass en EC2" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif">
<title>Despliegue de la API de SyncPass en EC2</title>
<rect width="1400" height="800" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" fill="#1a1a1a" font-weight="700">SyncPass · Despliegue de la API en Amazon EC2</text>
<text x="24.0" y="52.0" font-size="11.5" fill="#5d6673" font-weight="400">Clientes, autenticación con Cognito y API REST con su base de datos dentro de la VPC</text>
