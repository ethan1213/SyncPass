<text x="1154.0" y="221.5" font-size="10.5" fill="#1a1a1a" font-weight="400">Servidor de la API</text>
<rect x="1130.0" y="229.0" width="18.0" height="11.0" rx="2" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1154.0" y="238.5" font-size="10.5" fill="#1a1a1a" font-weight="400">Base de datos</text>
<rect x="1130.0" y="246.0" width="18.0" height="11.0" rx="2" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="1154.0" y="255.5" font-size="10.5" fill="#1a1a1a" font-weight="400">Regla de seguridad</text>
