<text x="1317.1" y="32.0" font-size="11" fill="#1a1a1a" font-weight="700" text-anchor="middle">Infraestructura</text>
<rect x="40.0" y="150.0" width="230.0" height="230.0" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1" stroke-dasharray="5 3"/>
<text x="155.0" y="174.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">Clientes</text>
<rect x="60.0" y="194.0" width="190.0" height="70.0" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="155.0" y="219.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Navegador</text>
<text x="155.0" y="232.8" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">React + Vite</text>
<text x="155.0" y="246.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">(Vercel)</text>
<rect x="60.0" y="282.0" width="190.0" height="70.0" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="155.0" y="307.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">App Android</text>
<text x="155.0" y="320.8" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Kotlin + Compose</text>
<text x="155.0" y="334.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">(base local Room)</text>
<rect x="540.0" y="92.0" width="280.0" height="74.0" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="680.0" y="119.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Amazon Cognito · user pool</text>
<text x="680.0" y="132.8" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">grupos: admin, coordinador,</text>
<text x="680.0" y="146.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">monitor, participante</text>
<text x="680.0" y="186.0" font-size="10" fill="#5d6673" font-weight="400" text-anchor="middle">Hosted UI + tokens JWT</text>
<rect x="400.0" y="220.0" width="700.0" height="330.0" rx="6" fill="#ffffff" stroke="#6c8ebf" stroke-width="1" stroke-dasharray="6 4"/>
<text x="420.0" y="246.0" font-size="11.5" fill="#5d6673" font-weight="700">VPC 10.0.0.0/16 · región sa-east-1</text>
<rect x="424.0" y="262.0" width="330.0" height="270.0" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
<text x="440.0" y="284.0" font-size="10" fill="#5d6673" font-weight="700">Subred pública 10.0.1.0/24</text>
<rect x="444.0" y="298.0" width="290.0" height="130.0" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="589.0" y="346.5" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Instancia EC2 t3.micro</text>
<text x="589.0" y="360.0" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Ubuntu 22.04</text>
<text x="589.0" y="373.5" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Nginx (443) → Node/Express</text>
<text x="589.0" y="387.0" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">PM2 mantiene el proceso</text>
<rect x="444.0" y="440.0" width="290.0" height="70.0" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="589.0" y="465.6" font-size="10" fill="#1a1a1a" font-weight="400" text-anchor="middle">Security group web</text>
<text x="589.0" y="478.6" font-size="10" fill="#1a1a1a" font-weight="400" text-anchor="middle">entrada 443 y 22</text>
<text x="589.0" y="491.6" font-size="10" fill="#1a1a1a" font-weight="400" text-anchor="middle">salida a la base de datos</text>
<rect x="778.0" y="262.0" width="300.0" height="270.0" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
<text x="794.0" y="284.0" font-size="10" fill="#5d6673" font-weight="700">Subred privada 10.0.2.0/24</text>
<rect x="798.0" y="298.0" width="260.0" height="100.0" rx="3" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="928.0" y="338.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">Amazon RDS · MySQL 8</text>
<text x="928.0" y="351.8" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">base syncpass</text>
<text x="928.0" y="365.3" font-size="10.5" fill="#1a1a1a" font-weight="400" text-anchor="middle">sin IP pública</text>
<rect x="798.0" y="410.0" width="260.0" height="70.0" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="928.0" y="435.6" font-size="10" fill="#1a1a1a" font-weight="400" text-anchor="middle">Security group base</text>
<text x="928.0" y="448.6" font-size="10" fill="#1a1a1a" font-weight="400" text-anchor="middle">entrada 3306 solo desde</text>
<text x="928.0" y="461.6" font-size="10" fill="#1a1a1a" font-weight="400" text-anchor="middle">el grupo de la EC2</text>
<path d="M 250.0 214.0 L 322.0 214.0 L 322.0 118.0 L 540.0 118.0" fill="none" stroke="#6c8ebf" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="540.00,118.00 531.00,121.50 531.00,114.50" fill="#6c8ebf" stroke="#6c8ebf" stroke-width="1"/>
<rect x="401.8" y="104.2" width="56.4" height="15.0" rx="2" fill="#ffffff" opacity="0.95"/>
<text x="430.0" y="113.0" font-size="10" fill="#5d6673" font-weight="600" text-anchor="middle">1. login</text>
<path d="M 540.0 150.0 L 300.0 150.0 L 300.0 244.0 L 250.0 244.0" fill="none" stroke="#d79b00" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="250.00,244.00 259.00,240.50 259.00,247.50" fill="#d79b00" stroke="#d79b00" stroke-width="1"/>
<rect x="257.3" y="188.2" width="85.4" height="15.0" rx="2" fill="#ffffff" opacity="0.95"/>
<text x="300.0" y="197.0" font-size="10" fill="#5d6673" font-weight="600" text-anchor="middle">2. tokens JWT</text>
<path d="M 250.0 317.0 L 444.0 317.0" fill="none" stroke="#6c8ebf" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="444.00,317.00 435.00,320.50 435.00,313.50" fill="#6c8ebf" stroke="#6c8ebf" stroke-width="1"/>
<rect x="295.6" y="304.2" width="102.8" height="15.0" rx="2" fill="#ffffff" opacity="0.95"/>
<text x="347.0" y="313.0" font-size="10" fill="#5d6673" font-weight="600" text-anchor="middle">3. HTTPS + token</text>
<path d="M 590.0 298.0 L 590.0 166.0" fill="none" stroke="#d79b00" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="590.00,166.00 593.50,175.00 586.50,175.00" fill="#d79b00" stroke="#d79b00" stroke-width="1"/>
<rect x="622.5" y="228.2" width="155.0" height="15.0" rx="2" fill="#ffffff" opacity="0.95"/>
<text x="700.0" y="237.0" font-size="10" fill="#5d6673" font-weight="600" text-anchor="middle">4. valida la firma (JWKS)</text>
<path d="M 734.0 348.0 L 798.0 348.0" fill="none" stroke="#6c8ebf" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="798.00,348.00 789.00,351.50 789.00,344.50" fill="#6c8ebf" stroke="#6c8ebf" stroke-width="1"/>
<rect x="743.6" y="335.2" width="44.8" height="15.0" rx="2" fill="#ffffff" opacity="0.95"/>
<text x="766.0" y="344.0" font-size="10" fill="#5d6673" font-weight="600" text-anchor="middle">5. SQL</text>
<path d="M 40.0 420.0 H 358.0 L 370.0 432.0 V 530.0 H 40.0 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M 358.0 420.0 V 432.0 H 370.0 Z" fill="#ffffff" stroke="#d6b656" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.85"/>
<text x="49.0" y="441.0" font-size="11" fill="#1a1a1a" font-weight="700">Orden de una petición</text>
<text x="49.0" y="457.0" font-size="11" fill="#1a1a1a" font-weight="400">1. El cliente abre la Hosted UI de Cognito.</text>
<text x="49.0" y="473.0" font-size="11" fill="#1a1a1a" font-weight="400">2. Cognito devuelve los tokens al cliente.</text>
<text x="49.0" y="489.0" font-size="11" fill="#1a1a1a" font-weight="400">3. Cada llamada a la API lleva el token.</text>
<text x="49.0" y="505.0" font-size="11" fill="#1a1a1a" font-weight="400">4. La API valida la firma contra Cognito.</text>
<text x="49.0" y="521.0" font-size="11" fill="#1a1a1a" font-weight="400">5. Recién ahí se consulta la base de datos.</text>
<path d="M 400.0 580.0 H 718.0 L 730.0 592.0 V 690.0 H 400.0 Z" fill="#d5e8d4" stroke="#82b366" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M 718.0 580.0 V 592.0 H 730.0 Z" fill="#ffffff" stroke="#82b366" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.85"/>
<text x="409.0" y="601.0" font-size="11" fill="#1a1a1a" font-weight="700">Qué se corre al desplegar</text>
<text x="409.0" y="617.0" font-size="11" fill="#1a1a1a" font-weight="400">git pull en la instancia</text>
<text x="409.0" y="633.0" font-size="11" fill="#1a1a1a" font-weight="400">npm ci (solo dependencias de producción)</text>
<text x="409.0" y="649.0" font-size="11" fill="#1a1a1a" font-weight="400">pm2 restart syncpass-api</text>
<text x="409.0" y="665.0" font-size="11" fill="#1a1a1a" font-weight="400">Nginx hace de proxy inverso al puerto 3000</text>
<text x="409.0" y="681.0" font-size="11" fill="#1a1a1a" font-weight="400">y resuelve el certificado TLS.</text>
<path d="M 760.0 580.0 H 1088.0 L 1100.0 592.0 V 690.0 H 760.0 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M 1088.0 580.0 V 592.0 H 1100.0 Z" fill="#ffffff" stroke="#d6b656" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.85"/>
<text x="769.0" y="601.0" font-size="11" fill="#1a1a1a" font-weight="700">Lo que no viaja al repositorio</text>
<text x="769.0" y="617.0" font-size="11" fill="#1a1a1a" font-weight="400">Las credenciales de la base y el id del user</text>
<text x="769.0" y="633.0" font-size="11" fill="#1a1a1a" font-weight="400">pool van en variables de entorno de la</text>
<text x="769.0" y="649.0" font-size="11" fill="#1a1a1a" font-weight="400">instancia, nunca en el repositorio.</text>
<text x="769.0" y="665.0" font-size="11" fill="#1a1a1a" font-weight="400">La base solo acepta conexiones desde el</text>
<text x="769.0" y="681.0" font-size="11" fill="#1a1a1a" font-weight="400">security group de la EC2.</text>
<rect x="1120.0" y="150.0" width="154.1" height="118.0" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4 3"/>
<text x="1130.0" y="168.0" font-size="10.5" fill="#5d6673" font-weight="700">Leyenda</text>
<rect x="1130.0" y="178.0" width="18.0" height="11.0" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1154.0" y="187.5" font-size="10.5" fill="#1a1a1a" font-weight="400">Cliente</text>
<rect x="1130.0" y="195.0" width="18.0" height="11.0" rx="2" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1154.0" y="204.5" font-size="10.5" fill="#1a1a1a" font-weight="400">Servicio de AWS</text>
