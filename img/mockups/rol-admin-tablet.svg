<text x="840.0" y="127.0" font-size="10.5" fill="#1a1a1a" font-weight="700">Vista exclusiva del admin</text>
<text x="840.0" y="142.0" font-size="10" fill="#5d6673" font-weight="400">Los otros tres roles no ven</text>
