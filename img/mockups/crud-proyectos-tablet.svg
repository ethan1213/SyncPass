<text x="821.0" y="425.0" font-size="11" fill="#1a1a1a" font-weight="700">Qué cambia respecto al escritorio</text>
<text x="821.0" y="441.0" font-size="11" fill="#1a1a1a" font-weight="400">El menú lateral pasa a pestañas</text>
