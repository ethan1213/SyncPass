<text x="1110.0" y="123.0" font-size="10.5" fill="#1a1a1a" font-weight="700">Funciona sin conexión</text>
<text x="1110.0" y="138.0" font-size="10" fill="#5d6673" font-weight="400">Es el CRUD que no depende</text>
<text x="1110.0" y="151.0" font-size="10" fill="#5d6673" font-weight="400">de la API ni de la red.</text>
<circle cx="1093.00" cy="179.00" r="10.00" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="1093.0" y="183.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">2</text>
<text x="1110.0" y="177.0" font-size="10.5" fill="#1a1a1a" font-weight="700">Crear, leer, editar y borrar</text>
<text x="1110.0" y="192.0" font-size="10" fill="#5d6673" font-weight="400">Las cuatro operaciones ocurren</text>
<text x="1110.0" y="205.0" font-size="10" fill="#5d6673" font-weight="400">en el almacenamiento local.</text>
<circle cx="1093.00" cy="233.00" r="10.00" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="1093.0" y="237.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">3</text>
<text x="1110.0" y="231.0" font-size="10.5" fill="#1a1a1a" font-weight="700">El envío es otro paso</text>
<text x="1110.0" y="246.0" font-size="10" fill="#5d6673" font-weight="400">Recién ahí aparece la API</text>
<text x="1110.0" y="259.0" font-size="10" fill="#5d6673" font-weight="400">y el registro pasa a is_synced = 1.</text>
