<text x="68.0" y="948.0" font-size="9.5" fill="#1a1a1a" font-weight="700">Listar</text>
<text x="120.0" y="948.0" font-size="9.5" fill="#5d6673" font-weight="400" font-family="Consolas, 'Courier New', monospace">GET /api/talleres</text>
<text x="68.0" y="968.0" font-size="9.5" fill="#1a1a1a" font-weight="700">Crear</text>
<text x="120.0" y="968.0" font-size="9.5" fill="#5d6673" font-weight="400" font-family="Consolas, 'Courier New', monospace">POST /api/talleres</text>
<text x="374.0" y="948.0" font-size="9.5" fill="#1a1a1a" font-weight="700">Editar</text>
<text x="426.0" y="948.0" font-size="9.5" fill="#5d6673" font-weight="400" font-family="Consolas, 'Courier New', monospace">PUT /api/talleres/:id</text>
<text x="374.0" y="968.0" font-size="9.5" fill="#1a1a1a" font-weight="700">Eliminar</text>
<text x="426.0" y="968.0" font-size="9.5" fill="#5d6673" font-weight="400" font-family="Consolas, 'Courier New', monospace">DELETE /api/talleres/:id</text>
<text x="68.0" y="994.0" font-size="9" fill="#5d6673" font-weight="400">Todas con el token de Cognito en la cabecera Authorization.</text>
