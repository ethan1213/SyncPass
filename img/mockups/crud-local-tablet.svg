<text x="821.0" y="387.0" font-size="11" fill="#1a1a1a" font-weight="400">El menú lateral pasa a pestañas</text>
<text x="821.0" y="403.0" font-size="11" fill="#1a1a1a" font-weight="400">horizontales y las grillas bajan</text>
<text x="821.0" y="419.0" font-size="11" fill="#1a1a1a" font-weight="400">a dos columnas.</text>
<text x="821.0" y="435.0" font-size="11" fill="#1a1a1a" font-weight="400">Es la misma página, no otra.</text>
