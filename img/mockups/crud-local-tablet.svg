<text x="44.0" y="464.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">3</text>
<text x="812.0" y="104.0" font-size="12" fill="#5d6673" font-weight="700">Referencias del dibujo</text>
<circle cx="823.00" cy="129.00" r="10.00" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="823.0" y="133.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">1</text>
<text x="840.0" y="127.0" font-size="10.5" fill="#1a1a1a" font-weight="700">Funciona sin conexión</text>
<text x="840.0" y="142.0" font-size="10" fill="#5d6673" font-weight="400">Es el CRUD que no depende</text>
<text x="840.0" y="155.0" font-size="10" fill="#5d6673" font-weight="400">de la API ni de la red.</text>
<circle cx="823.00" cy="183.00" r="10.00" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="823.0" y="187.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">2</text>
<text x="840.0" y="181.0" font-size="10.5" fill="#1a1a1a" font-weight="700">Crear, leer, editar y borrar</text>
<text x="840.0" y="196.0" font-size="10" fill="#5d6673" font-weight="400">Las cuatro operaciones ocurren</text>
<text x="840.0" y="209.0" font-size="10" fill="#5d6673" font-weight="400">en el almacenamiento local.</text>
<circle cx="823.00" cy="237.00" r="10.00" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="823.0" y="241.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">3</text>
<text x="840.0" y="235.0" font-size="10.5" fill="#1a1a1a" font-weight="700">El envío es otro paso</text>
<text x="840.0" y="250.0" font-size="10" fill="#5d6673" font-weight="400">Recién ahí aparece la API</text>
<text x="840.0" y="263.0" font-size="10" fill="#5d6673" font-weight="400">y el registro pasa a is_synced = 1.</text>
<circle cx="823.00" cy="291.00" r="10.00" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="823.0" y="295.0" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">4</text>
<text x="840.0" y="289.0" font-size="10.5" fill="#1a1a1a" font-weight="700">Mismo formulario de siempre</text>
<text x="840.0" y="304.0" font-size="10" fill="#5d6673" font-weight="400">El participante no nota que</text>
<text x="840.0" y="317.0" font-size="10" fill="#5d6673" font-weight="400">está trabajando en local.</text>
