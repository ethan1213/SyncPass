<path d="M 1010.0 110.0 H 1328.0 L 1340.0 122.0 V 204.0 H 1010.0 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M 1328.0 110.0 V 122.0 H 1340.0 Z" fill="#ffffff" stroke="#d6b656" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.85"/>
<text x="1019.0" y="131.0" font-size="11" fill="#1a1a1a" font-weight="700">El CRUD local</text>
<text x="1019.0" y="147.0" font-size="11" fill="#1a1a1a" font-weight="400">Crear, leer, editar y borrar un borrador</text>
<text x="1019.0" y="163.0" font-size="11" fill="#1a1a1a" font-weight="400">ocurre solo aquí: no hay red de por medio.</text>
<text x="1019.0" y="179.0" font-size="11" fill="#1a1a1a" font-weight="400">El participante puede corregir su respuesta</text>
<text x="1019.0" y="195.0" font-size="11" fill="#1a1a1a" font-weight="400">las veces que quiera antes del envío.</text>
<path d="M 1010.0 260.0 H 1328.0 L 1340.0 272.0 V 354.0 H 1010.0 Z" fill="#d5e8d4" stroke="#82b366" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M 1328.0 260.0 V 272.0 H 1340.0 Z" fill="#ffffff" stroke="#82b366" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.85"/>
<text x="1019.0" y="281.0" font-size="11" fill="#1a1a1a" font-weight="700">Qué pasa después del envío</text>
<text x="1019.0" y="297.0" font-size="11" fill="#1a1a1a" font-weight="400">Un borrador enviado conserva su id_local</text>
<text x="1019.0" y="313.0" font-size="11" fill="#1a1a1a" font-weight="400">y recibe el id del servidor en la respuesta.</text>
<text x="1019.0" y="329.0" font-size="11" fill="#1a1a1a" font-weight="400">Si el envío falla, la fila sigue en cola_sync</text>
<text x="1019.0" y="345.0" font-size="11" fill="#1a1a1a" font-weight="400">con un intento más y el último error.</text>
<path d="M 1010.0 410.0 H 1328.0 L 1340.0 422.0 V 504.0 H 1010.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/>
<path d="M 1328.0 410.0 V 422.0 H 1340.0 Z" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.85"/>
<text x="1019.0" y="431.0" font-size="11" fill="#1a1a1a" font-weight="700">A qué tabla del servidor corresponde</text>
<text x="1019.0" y="447.0" font-size="11" fill="#1a1a1a" font-weight="400">borrador_encuesta → encuestas_satisfaccion</text>
<text x="1019.0" y="463.0" font-size="11" fill="#1a1a1a" font-weight="400">marcacion_local → asistencia_marcaciones</text>
<text x="1019.0" y="479.0" font-size="11" fill="#1a1a1a" font-weight="400">El id del dispositivo no viaja: el servidor</text>
<text x="1019.0" y="495.0" font-size="11" fill="#1a1a1a" font-weight="400">crea el suyo y lo devuelve.</text>
